<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="css/style.css">  
</head>
<body>
    
    <header class="navbar">    
        <h1>Academic Tracker</h1>
    </header>

    <main>
    <section class="summary-cards">
      <div class="card">
        <h2>Cumulative GPA</h2>
        <p id="gpa-value">0.00</p>
      </div>
      <div class="card">
        <h2>Total Credits</h2>
        <p id="credits-value">0</p>
      </div>
    </section>
    <section class="course-form">
      <h2>Add Course</h2>
      <form id="course-form">
        <label for="course-code">Course Code</label>
        <input type="text" id="course-code" placeholder="e.g. ICS 401" required>

        <label for="credit-hours">Credit Hours</label>
        <input type="number" id="credit-hours" placeholder="e.g. 3" min="1" max="6" required>

        <label for="letter-grade">Letter Grade</label>
        <select id="letter-grade" required>
          <option value="">Select grade</option>
          <option value="A">A</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B">B</option>
          <option value="B-">B-</option>
          <option value="C+">C+</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="F">F</option>
        </select>

        <button type="submit">Add Course</button>
      </form>
    </section>

    <section class="course-table-section">
      <h2>Courses</h2>
      <button id="clear-courses">Clear All</button>
      <table id="course-table">
        <thead>
          <tr>
            <th>Course Code</th>
            <th>Credit Hours</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="course-table-body">
        </tbody>
      </table>
    </section>

      <section class="chart-section">
      <h2>Grade Distribution</h2>
      <canvas id="grade-chart"></canvas>
    </section>
    
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
